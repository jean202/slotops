spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/slotops
    username: slotops
    password: slotops
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: your-super-secret-key-change-in-production-min-256-bits-long-string-for-hs256
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

logging:
  level:
    org.hibernate.SQL: info
