spring:
  datasource:
    url: jdbc:h2:mem:slotops;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: test-secret-key-for-testing-purposes-only-min-256-bits-long-string-here
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000
